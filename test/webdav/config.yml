# Config for the local hacdias/webdav test server (docker-compose.webdav.yml).
# Mirrors the permissive CORS setup documented for the real NAS in docs/NAS_SETUP.md,
# so integration tests exercise the same PROPFIND/GET/PUT/DELETE + CORS behavior
# webdavClient.ts relies on.
address: 0.0.0.0
port: 6065
prefix: /
tls: false

cors:
  enabled: true
  credentials: true
  allowed_headers:
    - Depth
    - Content-Type
    - Authorization
    - If-Match
  allowed_hosts:
    - "*"
  allowed_methods:
    - GET
    - PUT
    - DELETE
    - PROPFIND
    - MKCOL
    - OPTIONS
  exposed_headers:
    - Content-Length
    - ETag

users:
  - username: testuser
    password: testpass
    directory: /data
    permissions: CRUD
