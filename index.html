<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="Privates, betreiberunabhängiges Journal mit NAS-Sync" />

    <!--
      connect-src stays open to http(s) because the WebDAV sync target is a NAS URL the user
      configures at runtime (Settings) — the CSP can't know it in advance. Everything else is
      locked to 'self'; style-src needs 'unsafe-inline' for Tailwind's and React's inline
      style="" attributes (e.g. progress bar widths), not for injected <script> tags.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http: https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <!-- iOS Safari does not reliably read icons from manifest.json; a real link tag is required. -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="myNotes" />

    <title>myNotes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
